server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service. The trailing slash on proxy_pass
    # strips the /api prefix, so /api/metrics -> backend:8000/metrics.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every non-file route serves index.html so client-side
    # routing (/login, /leaks, …) works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
