name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: leaksentinel
          POSTGRES_PASSWORD: leaksentinel
          POSTGRES_DB: leaksentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaksentinel -d leaksentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The app reads DATABASE_URL / JWT_SECRET from the environment.
      DATABASE_URL: postgresql+psycopg://leaksentinel:leaksentinel@localhost:5432/leaksentinel
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRY_HOURS: "8"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Apply migrations (validates the migration builds the schema)
        run: alembic upgrade head

      - name: Generate synthetic data
        run: python scripts/generate_synthetic_data.py

      - name: Ingest insurer feeds
        run: make ingest

      # The precision/recall + end-to-end guarantees live in the integration
      # tests. They must actually RUN — pytest exits 5 (failing this step) if the
      # marker selects zero tests, so a misconfigured Postgres can't pass silently.
      - name: Integration tests (require Postgres)
        run: pytest -m integration --strict-markers -v

      - name: Unit tests
        run: pytest -m "not integration" --strict-markers -v
